<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>호랑이 동작 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--ink:#2b1a10;--soft:#6b5444;--paper:#fffaf1;--line:#3d2314;--teal:#1b6b8a;--teal-soft:#dff0f2;--gold:#d19a1e;--bg1:#e4f3f6;--bg2:#fdf1dc;
  --disp:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body)}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:860px){.wrap{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--disp);font-weight:400;font-size:clamp(26px,6vw,36px);margin:0}
header p{margin:0;color:var(--soft);font-size:15px}
.stage{position:relative;border:3px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(var(--bg1),var(--bg2));box-shadow:0 6px 0 rgba(61,35,20,.18)}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1}
.now{position:absolute;left:12px;top:12px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--disp);font-size:20px}
.panel{display:grid;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.act{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-size:16px;text-align:left;cursor:pointer;box-shadow:0 3px 0 rgba(61,35,20,.2)}
.act span{word-break:keep-all}
.act b{flex:0 0 34px;height:34px;border-radius:10px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-family:var(--disp);font-weight:400;font-size:19px}
.act[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:#0f4a61}
.act[aria-pressed="true"] b{background:#fff}
.act:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:46px;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.primary{background:var(--teal);border-color:#0f4a61;color:#fff}
label{font-size:15px;color:var(--soft);display:flex;align-items:center;gap:6px}
input[type=text]{min-height:46px;flex:1 1 180px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:17px;background:#fff;color:var(--ink)}
select{min-height:40px;border:2px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
.box{border:2px dashed #c9b49c;border-radius:16px;padding:12px;display:grid;gap:10px;background:#fff}
.box h2{margin:0;font-size:16px}
.hint{font-size:14px;color:var(--soft);margin:0}
code{background:#f3e8d8;padding:1px 6px;border-radius:6px}
@media (prefers-reduced-motion:reduce){.act{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>호랑이 동작 모음</h1><p>번호를 누르면 그 동작을 재생해요. 스토리보드에는 번호로 적으면 돼요.</p></header>
  <div class="stage"><canvas id="cv" width="1024" height="1024" aria-label="호랑이 애니메이션"></canvas><div class="now" id="now">3 기본 상태</div></div>
  <div class="panel">
    <div class="grid" id="grid"></div>
    <div class="row">
      <label><input type="checkbox" id="loop" checked> 반복</label>
      <label>속도 <select id="speed"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="1.5">1.5배</option></select></label>
      <button class="btn" id="stopBtn" type="button">기본으로</button>
    </div>
    <div class="box">
      <h2>순서대로 재생 (스토리보드 미리보기)</h2>
      <div class="row"><input type="text" id="seq" value="3, 1, 4, 2, 6, 8" aria-label="동작 번호 순서"><button class="btn primary" id="seqBtn" type="button">순서 재생</button></div>
      <p class="hint">번호를 쉼표로 적어요. 반복 동작은 한 번에 3초씩 재생돼요. <code>1:5</code>처럼 쓰면 1번을 5초 동안.</p>
    </div>
  </div>
</div>

/* ---------- 재생 ---------- */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');

let nextBlink=performance.now()+2500, blinkUntil=0;
function play(n, opts={}){
  const a=BY[n]; if(!a) return;
  prevPose={...lastPose}; blendT=performance.now(); cur=a; t0=performance.now();
  document.getElementById('now').textContent=a.n+' '+a.name;
  document.querySelectorAll('.act').forEach(b=>b.setAttribute('aria-pressed', String(+b.dataset.n===a.n)));
  if(!opts.fromSeq){ seq=[]; }
  try{ history.replaceState(null,'','#'+a.n); }catch(e){}
}
function poseAt(now){
  let t=(now-t0)/1000*speed;
  const L=cur.len;
  if(seq.length){ if(now>=seqEnd){ nextInSeq(); t=0; } else t = cur.loop ? t%L : Math.min(t,L); }
  else if(t>=L){
    if(cur.loop && loopOn) t=t%L;
    else { t=L-1e-3; if(cur!==BY[3] && (now-t0)/1000*speed > L+.4) play(3); }
  }
  const p=base(); cur.f(p, reduce? t*.5 : t);
  if(reduce){ p.rootY*=.4; }
  // 이전 동작에서 부드럽게 넘어오기 (숫자 값만)
  const bt=ease((now-blendT)/260);
  if(prevPose && bt<1){ for(const k of NUM) p[k]=prevPose[k]+(p[k]-prevPose[k])*bt; }
  // 자동 깜빡임
  if(p.blink && p.eyeL==='open' && p.eyeR==='open'){
    if(now>nextBlink){ blinkUntil=now+120; nextBlink=now+2200+Math.random()*3200; }
    if(now<blinkUntil){ p.eyeL=p.eyeR='closed'; }
  }

}
function nextInSeq(){
  if(seqI>=seq.length){ seq=[]; play(3); return; }
  const it=seq[seqI++]; play(it.n,{fromSeq:true});
  const a=BY[it.n]; const dur = it.sec ? it.sec : (a.loop? 3 : a.len/speed);
  seqEnd=performance.now()+dur*1000;
}
/* ---------- 그리기 ---------- */
function local(node,p){
  const m=new DOMMatrix(); const r=RIG[node]; const pv=r.pivot||[0,0];
  let rot=0, sx=1, sy=1, tx=0, ty=0;
  switch(node){
    case 'root': rot=p.rootR; sx=p.rootSX; sy=p.rootSY; tx=p.rootX; ty=p.rootY; break;
    case 'head': rot=p.head; ty=p.headY; break;
    case 'mouthOpen': sx=p.mouthSX; sy=Math.max(.05,p.mouth); break;
    case 'browL': rot=p.browLR; ty=p.browLY; break;
    case 'browR': rot=p.browRR; ty=p.browRY; break;
    case 'spark': { const k=p.spark; sx=sy=k; break; }
    case 'footL': rot=p.footLR; ty=p.footLY; break;
    case 'footR': rot=p.footRR; ty=p.footRY; break;
    default: if(node in p) rot=p[node];
  }
  m.translateSelf(pv[0]+tx, pv[1]+ty); if(rot) m.rotateSelf(rot); if(sx!==1||sy!==1) m.scaleSelf(sx,sy); m.translateSelf(-pv[0],-pv[1]);
  return m;
}
function draw(now){

  // 화면 맞춤: 호랑이(약 x 40~900, y 40~930)가 캔버스에 들어오게
  const view=new DOMMatrix().translateSelf(W*.1, W*.16).scaleSelf(W/1024*.8);
  // 그림자
  ctx.setTransform(view); ctx.fillStyle='rgba(61,35,20,.16)'; ctx.beginPath();
  ctx.ellipse(500+p.rootX,912,300*p.shadow,34*p.shadow,0,0,PI*2); ctx.fill();
  const W_={};
  const world=n=>{ if(W_[n]) return W_[n]; const r=RIG[n]; let par=r.parent? world(r.parent) : view;
    if(n==='root' && p.spin){ const cx=500+p.rootX, cy=600+p.rootY; par=view.translate(cx,cy).rotate(p.spin).translate(-cx,-cy); } return W_[n]=par.multiply(local(n,p)); };
  const t=(now-t0)/1000;
  for(const k of ORDER){
    if(!IMG[k].complete) continue;
    // 눈·입 상태에 따라 보이기
    if(k.startsWith('eyeL_')||k.startsWith('eyeR_')){
      const side=k[3], st=side==='L'?p.eyeL:p.eyeR, part=k.slice(5);
      const isOpen=['white','pupil','ring','line'].includes(part);
      if(isOpen && st!=='open') continue; if(part==='closed' && st!=='closed') continue; if(part==='smile' && st!=='smile') continue;
    }
    if(k==='mouthOpen' && p.mouth<.06) continue;
    const pr=PARTS[k]; let m=world(k);
    if(k==='eyeL_pupil'||k==='eyeR_pupil'){ m=m.translate(Math.max(-11,Math.min(11,p.pupX)), Math.max(-6,Math.min(6,p.pupY))); }
    ctx.setTransform(m);
    if(k==='spark'){ ctx.globalAlpha=.7+.3*S(t*5); }
    ctx.drawImage(IMG[k], pr.x, pr.y, pr.w, pr.h);
    ctx.globalAlpha=1;
  }
  // 볼터치
  if(p.blush>.02){ ctx.setTransform(world('head')); ctx.fillStyle='rgba(240,100,100,'+(.75*p.blush)+')';
    for(const [x,y] of [[372,438],[642,428]]){ ctx.beginPath(); ctx.ellipse(x,y,34,17,0,0,PI*2); ctx.fill(); } }
  // 효과
  if(p.fx){
    const hm=world('head'); ctx.setTransform(hm);
    if(p.fx.type==='dots'){ ctx.fillStyle='#fff'; ctx.strokeStyle='#3d2314'; ctx.lineWidth=4;
      const pts=[[700,240,14],[740,195,20],[790,140,30]];
      for(let i=0;i<p.fx.n;i++){ const [x,y,r]=pts[i]; ctx.beginPath(); ctx.arc(x,y,r,0,PI*2); ctx.fill(); ctx.stroke(); } }
    if(p.fx.type==='bang'){ ctx.fillStyle='#d9534f'; ctx.strokeStyle='#fff'; ctx.lineWidth=10; ctx.font='bold 170px Jua, sans-serif'; ctx.strokeText('!',730,230); ctx.fillText('!',730,230); }
    if(p.fx.type==='sweat'){ const u=(p.fx.t*.6)%1; ctx.globalAlpha=1-u*.6; ctx.fillStyle='#8fd0ea'; ctx.strokeStyle='#3d2314'; ctx.lineWidth=4;
      const x=700, y=260+u*50; ctx.beginPath(); ctx.moveTo(x,y-52); ctx.quadraticCurveTo(x+36,y,x,y+22); ctx.quadraticCurveTo(x-36,y,x,y-52); ctx.fill(); ctx.stroke(); ctx.globalAlpha=1; }
    if(p.fx.type==='burst'){ const u=Math.min(1,(p.fx.t-.8)/.6); ctx.strokeStyle='#f0a500'; ctx.lineWidth=16; ctx.lineCap='round'; ctx.globalAlpha=1-Math.max(0,u-.6)/.4;
      for(let i=0;i<8;i++){ const a=i/8*PI*2, r0=330+u*40, r1=380+u*70; ctx.beginPath(); ctx.moveTo(500+Math.cos(a)*r0,330+Math.sin(a)*r0*.8); ctx.lineTo(500+Math.cos(a)*r1,330+Math.sin(a)*r1*.8); ctx.stroke(); }
      ctx.globalAlpha=1; ctx.fillStyle='#d9534f'; ctx.strokeStyle='#fff'; ctx.lineWidth=10; ctx.font='bold 150px Jua, sans-serif'; ctx.strokeText('!',740,220); ctx.fillText('!',740,220); }
    if(p.fx.type==='note'){ ctx.fillStyle='#1b6b8a'; ctx.font='80px sans-serif';
      for(let i=0;i<2;i++){ const u=((p.fx.t*.5+i/2)%1); ctx.globalAlpha=1-u; ctx.fillText(i?'♫':'♪', (i?220:740)+S(u*6)*20, 260-u*180); } ctx.globalAlpha=1; }
    if(p.fx.type==='q'){ ctx.fillStyle='#1b6b8a'; ctx.strokeStyle='#fff'; ctx.lineWidth=10; ctx.font='bold 150px Jua, sans-serif'; ctx.strokeText('?',735,225); ctx.fillText('?',735,225); }
    if(p.fx.type==='hmph'){ const u=Math.min(1,(p.fx.t-.3)/.25); ctx.save(); ctx.translate(250,170); ctx.scale(u,u);
      ctx.fillStyle='#fff'; ctx.strokeStyle='#3d2314'; ctx.lineWidth=6; ctx.beginPath(); ctx.ellipse(0,0,120,70,0,0,PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#d9534f'; ctx.font='bold 72px Jua, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('흥!',0,4); ctx.restore(); }
    if(p.fx.type==='shiver'){ ctx.setTransform(world('root')); ctx.strokeStyle='#3d2314'; ctx.lineWidth=7; ctx.lineCap='round';
      const o=S(p.fx.t*40)*4; for(const [x,s] of [[330,-1],[680,1]]){ for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(x+s*(i*16)+o,600+i*40); ctx.lineTo(x+s*(i*16+22)+o,615+i*40); ctx.stroke(); } } }
    if(p.fx.type==='zzz'){ ctx.fillStyle='#1b6b8a'; ctx.font='64px Jua, sans-serif';
      for(let i=0;i<3;i++){ const u=((p.fx.t*0.5+i/3)%1); ctx.globalAlpha=1-u; ctx.fillText('Z',690+u*90,250-u*170); } ctx.globalAlpha=1; }
  }
}
/* ---------- 화면 ---------- */
const grid=document.getElementById('grid');
grid.innerHTML = ACTS.map(a=>`<button class="act" type="button" data-n="${a.n}" aria-pressed="false"><b>${a.n}</b><span>${a.name}${a.note?`<br><small style="opacity:.75">${a.note}</small>`:''}</span></button>`).join('');
grid.addEventListener('click',e=>{ const b=e.target.closest('.act'); if(b) play(+b.dataset.n); });
document.getElementById('loop').addEventListener('change',e=>{ loopOn=e.target.checked; });
document.getElementById('speed').addEventListener('change',e=>{ const now=performance.now(); const t=(now-t0)/1000*speed; speed=+e.target.value; t0=now-t/speed*1000; });
document.getElementById('stopBtn').addEventListener('click',()=>play(3));
document.getElementById('seqBtn').addEventListener('click',()=>{
  const items=document.getElementById('seq').value.split(/[,\s]+/).filter(Boolean).map(s=>{ const [n,sec]=s.split(':'); return {n:+n, sec:sec?+sec:0}; }).filter(x=>BY[x.n]);
  if(!items.length) return; seq=items; seqI=0; seqEnd=0; nextInSeq();
});
// 다른 화면에서 쓰기: tigerPlay(번호), 주소 끝에 #6 처럼 붙이면 바로 그 동작
window.tigerPlay=n=>play(n);
const h=+location.hash.slice(1); play(BY[h]?h:3);
requestAnimationFrame(draw);
</script>
